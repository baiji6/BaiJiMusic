name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components (NDK / CMake / platform)
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # 正式签名密钥通过仓库 Secrets 注入，密钥库本身不入库。
      - name: Decode release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            # app/build.gradle 中的 file() 相对 app 模块解析，storeFile 必须写成绝对路径
            sed -i "s|^storeFile=.*|storeFile=$PWD/release.jks|" keystore.properties
            echo "已写入正式签名配置:"
            sed -E 's/^(storePassword|keyPassword)=.*/\1=***/' keystore.properties
          else
            echo "未配置 ANDROID_KEYSTORE_* Secret，release 将回退到 debug 签名"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        run: |
          set -e
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apk = $APK"
          # minSdk=24 时 apksigner 默认跳过 v1 校验，这里显式降低校验基准以验证 v1+v2+v3
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 21 "$APK"

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BaiJiMusic-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error

      # Release 说明取自仓库根目录 CHANGELOG.md 中与当前标签同名的段落（## v1.1）。
      - name: Extract changelog section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          TAG="$GITHUB_REF_NAME"
          echo "tag = $TAG"
          awk -v tag="$TAG" '
            substr($0, 1, 3 + length(tag)) == "## " tag { found = 1; next }
            found && substr($0, 1, 3) == "## " { exit }
            found && !started && $0 ~ /^[[:space:]]*$/ { next }
            found { started = 1; print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            echo "警告：CHANGELOG.md 中未找到 $TAG 段落，使用兜底说明" >&2
            printf '白姬音乐 %s\n' "$TAG" > RELEASE_BODY.md
          fi
          echo "--- RELEASE_BODY.md ---"
          cat RELEASE_BODY.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 白姬音乐 ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: artifacts/app-release.apk
          draft: false